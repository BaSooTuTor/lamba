<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختبر فهمك</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1D3FB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 32px; display: flex; flex-direction: column; gap: 20px; background: #FFFFFF; color: #1F2328; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; direction: rtl">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Home.dc.html" aria-label="إغلاق الدرس" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
    </div>
    <div style="font-size: 12px; color: #5B616B">4 / 6</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; font-weight: 600; color: #5B616B">اختبر فهمك · سؤال فكرة</div>
    <h1 style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 700">لو زوّدنا المقاومة والجهد ثابت، التيار هيعمل إيه؟</h1>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
      <button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
    </sc-for>
  </div>
  <div style="{{ fbStyle }}">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
      <div style="font-size: 16px; font-weight: 700">{{ fbTitle }}</div>
      <sc-if value="{{ correct }}" hint-placeholder-val="true">
        <div style="border-radius: 999px; background: #0F7B6C; color: #FFFFFF; padding: 2px 10px; font-size: 13px; font-weight: 700; direction: ltr">+10 XP</div>
      </sc-if>
    </div>
    <div style="font-size: 14px; line-height: 1.7">{{ fbBody }}</div>
  </div>
  <a href="Tutor.dc.html" style="margin-top: auto; height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">سؤال بنظام الامتحان</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#0F7B6C","#B45309"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'down' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2F5BEA';
    const pick = this.state.pick;
    const correct = pick === 'down';
    const base = 'height: 56px; border-radius: 12px; font: inherit; font-size: 16px; color: #1F2328; text-align: right; padding: 0 16px; ';
    const options = [
      { v: 'up', label: 'يزيد' },
      { v: 'down', label: 'يقل' },
      { v: 'same', label: 'يفضل زي ما هو' }
    ].map((o) => {
      let s = base + 'border: 1.5px solid #C9CDD3; background: #FFFFFF';
      if (pick === o.v) {
        s = o.v === 'down'
          ? base + 'border: 2px solid #0F7B6C; background: #E6F4F1; font-weight: 700'
          : base + 'border: 2px solid #C2410C; background: #FDF0E8; font-weight: 700';
      }
      return { label: o.label, style: s, pick: () => this.setState({ pick: o.v }) };
    });
    return {
      accent: accent,
      options: options,
      correct: correct,
      fbTitle: correct ? 'صح! علاقتهم عكسية' : 'قرّب، بس لأ',
      fbBody: correct
        ? 'المقاومة لما تزيد بتعطّل الشحنات أكتر، فالتيار يقل. ده نفس اللي شفته لما حرّكت المقاومة في المحاكاة.'
        : 'افتكر المحاكاة: لما زوّدت R والجهد ثابت، رقم الأميتر عمل إيه؟ جرّب تاني.',
      fbStyle: correct
        ? 'border-radius: 14px; background: #E6F4F1; color: #0F5A4F; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px'
        : 'border-radius: 14px; background: #FDF0E8; color: #7A2E0B; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px'
    };
  }
}
</script>
</body>
</html>
