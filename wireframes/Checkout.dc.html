<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>صفحة الدفع</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1D3FB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 28px; display: flex; flex-direction: column; gap: 18px; background: #FFFFFF; color: #1F2328; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; direction: rtl">
  <div style="border: 1.5px dashed #9AA0A8; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.7; color: #1F2328; background: #F7F7F8">
    <span style="font-weight: 700">Placeholder:</span> الصفحة دي بتعرضها Paymob (Unified Checkout)، مش احنا اللي بنصممها. احنا بس بنحوّل الطالب ليها، وبعد الدفع هي اللي بترجّعه لينا.
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
    <div style="width: 110px; height: 32px; border-radius: 8px; border: 1.5px dashed #9AA0A8; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #5B616B">لوجو بوابة الدفع</div>
    <div style="font-size: 12px; font-weight: 700; color: #B45309; border: 1.5px solid #B45309; border-radius: 999px; padding: 2px 10px; direction: ltr">Sandbox</div>
  </div>
  <div style="border: 1.5px solid #D8DBE0; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5B616B">التاجر</span><span style="font-weight: 600">فهّمني</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5B616B">المنتج</span><span style="font-weight: 600">باقة الثانوية العامة 2027</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 16px; border-top: 1.5px dashed #D8DBE0; padding-top: 8px; margin-top: 4px"><span style="font-weight: 600">الإجمالي</span><span style="font-weight: 700">799.00 EGP</span></div>
  </div>
  <form style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="card" style="font-size: 13px; font-weight: 600">رقم الكارت</label>
      <input id="card" type="text" placeholder="[كارت الاختبار من Paymob]" style="height: 48px; border: 1.5px solid #C9CDD3; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 15px">
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="exp" style="font-size: 13px; font-weight: 600">تاريخ الانتهاء</label>
        <input id="exp" type="text" placeholder="MM / YY" style="height: 48px; border: 1.5px solid #C9CDD3; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 15px; direction: ltr; text-align: right">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="cvv" style="font-size: 13px; font-weight: 600">CVV</label>
        <input id="cvv" type="text" placeholder="•••" style="height: 48px; border: 1.5px solid #C9CDD3; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 15px">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="holder" style="font-size: 13px; font-weight: 600">الاسم على الكارت</label>
      <input id="holder" type="text" placeholder="[اسم صاحب الكارت]" style="height: 48px; border: 1.5px solid #C9CDD3; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 15px">
    </div>
  </form>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <a href="Success.dc.html" style="height: 54px; border-radius: 12px; background: #1F2328; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">ادفع 799 EGP</a>
    <a href="Paywall.dc.html" style="text-align: center; font-size: 14px; padding: 8px; color: #5B616B">إلغاء والرجوع</a>
  </div>
</div>
</x-dc>
