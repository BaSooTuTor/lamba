<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مقدمة وتوقّع</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1D3FB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 32px; display: flex; flex-direction: column; gap: 20px; background: #FFFFFF; color: #1F2328; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; direction: rtl">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Home.dc.html" aria-label="إغلاق الدرس" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
    </div>
    <div style="font-size: 12px; color: #5B616B">1 / 6</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 600; color: #5B616B">قبل ما نبدأ</div>
    <div style="border-radius: 14px; background: #F2F3F5; padding: 14px 16px; font-size: 15px; line-height: 1.8">التيار الكهربي هو الشحنات اللي بتعدي في السلك كل ثانية. والجهد هو اللي بيزق الشحنات دي.</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 700">توقّع: لو زوّدنا جهد البطارية للضعف، اللمبة هتعمل إيه؟</h1>
    <p style="margin: 0; font-size: 13px; color: #5B616B">مفيش درجات هنا. عايزين نعرف إنت بتفكر إزاي.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
      <button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
    </sc-for>
  </div>
  <a href="Lesson.dc.html" style="margin-top: auto; height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">يلا نجرّب</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#0F7B6C","#B45309"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'more' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2F5BEA';
    const on = 'height: 56px; border-radius: 12px; border: 2px solid ' + accent + '; background: #EEF2FD; font: inherit; font-size: 16px; font-weight: 700; color: #1F2328; text-align: right; padding: 0 16px';
    const off = 'height: 56px; border-radius: 12px; border: 1.5px solid #C9CDD3; background: #FFFFFF; font: inherit; font-size: 16px; color: #1F2328; text-align: right; padding: 0 16px';
    const options = [
      { v: 'more', label: 'هتنوّر أكتر' },
      { v: 'less', label: 'هتنوّر أقل' },
      { v: 'same', label: 'هتفضل زي ما هي' }
    ].map((o) => ({ label: o.label, style: this.state.pick === o.v ? on : off, pick: () => this.setState({ pick: o.v }) }));
    return { accent: accent, options: options };
  }
}
</script>
</body>
</html>
