<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>السنة والشعبة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1D3FB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 28px; display: flex; flex-direction: column; gap: 20px; background: #FFFFFF; color: #1F2328; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; direction: rtl">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="System.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
    </div>
    <div style="font-size: 12px; color: #5B616B">2 / 4</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; font-weight: 600; color: #5B616B">الثانوية العامة</div>
    <h1 style="margin: 0; font-size: 24px; font-weight: 700">إنت في سنة كام؟</h1>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{ grades }}" as="g" hint-placeholder-count="3">
      <button type="button" onClick="{{ g.pick }}" style="{{ g.style }}">{{ g.label }}</button>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 17px; font-weight: 700">الشعبة</h2>
    <sc-if value="{{ hasTrack }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{ tracks }}" as="t" hint-placeholder-count="3">
          <button type="button" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ noTrack }}" hint-placeholder-val="{{ false }}">
      <div style="border-radius: 12px; background: #F2F3F5; padding: 12px 14px; font-size: 14px; color: #5B616B">أولى ثانوي لسه مفيهاش شعبة، فهنوريك المواد المشتركة.</div>
    </sc-if>
  </div>
  <div style="border-radius: 12px; border: 1.5px dashed #9AA0A8; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px">
    <div style="font-size: 14px; color: #5B616B">امتحانك هيبقى</div>
    <div style="font-size: 17px; font-weight: 700">صيف {{ examYear }}</div>
  </div>
  <a href="Subjects.dc.html" style="margin-top: auto; height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">التالي</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#0F7B6C","#B45309"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { grade: 3, track: 'sci' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2F5BEA';
    const on = 'height: 52px; border-radius: 12px; border: 2px solid ' + accent + '; background: #EEF2FD; font: inherit; font-size: 15px; font-weight: 700; color: #1F2328; text-align: right; padding: 0 16px';
    const off = 'height: 52px; border-radius: 12px; border: 1.5px solid #C9CDD3; background: #FFFFFF; font: inherit; font-size: 15px; color: #1F2328; text-align: right; padding: 0 16px';
    const gOn = on.replace('text-align: right; padding: 0 16px', 'text-align: center');
    const gOff = off.replace('text-align: right; padding: 0 16px', 'text-align: center');
    const grades = [{ v: 1, label: 'أولى' }, { v: 2, label: 'تانية' }, { v: 3, label: 'تالتة' }].map((g) => ({
      label: g.label,
      style: this.state.grade === g.v ? gOn : gOff,
      pick: () => this.setState({ grade: g.v })
    }));
    const tracks = [{ v: 'sci', label: 'علمي علوم' }, { v: 'math', label: 'علمي رياضة' }, { v: 'lit', label: 'أدبي' }].map((t) => ({
      label: t.label,
      style: this.state.track === t.v ? on : off,
      pick: () => this.setState({ track: t.v })
    }));
    return {
      accent: accent,
      grades: grades,
      tracks: tracks,
      hasTrack: this.state.grade !== 1,
      noTrack: this.state.grade === 1,
      examYear: 2027 + (3 - this.state.grade)
    };
  }
}
</script>
</body>
</html>
