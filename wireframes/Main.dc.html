<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التسجيل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1D3FB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 32px; display: flex; flex-direction: column; gap: 28px; background: #FFFFFF; color: #1F2328; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; direction: rtl">
  <div style="display: flex; align-items: center; gap: 12px">
    <div style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px dashed #9AA0A8; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #5B616B">لوجو</div>
    <div style="font-size: 22px; font-weight: 700">لمبة</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.35; font-weight: 700">افهم الفيزيا بإيدك، مش بالحفظ</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #5B616B">جرّب الدرس الأول مجانًا. محاكاة تلعب بيها، ومدرس ذكي بيشرحلك غلطتك.</p>
  </div>
  <form style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="name" style="font-size: 13px; font-weight: 600">الاسم</label>
      <input id="name" type="text" placeholder="مريم" style="height: 48px; border: 1.5px solid #C9CDD3; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 15px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 13px; font-weight: 600">الإيميل</label>
      <input id="email" type="email" placeholder="name@example.com" style="height: 48px; border: 1.5px solid #C9CDD3; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 15px; direction: ltr; text-align: right">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pass" style="font-size: 13px; font-weight: 600">كلمة السر</label>
      <input id="pass" type="password" placeholder="••••••••" style="height: 48px; border: 1.5px solid #C9CDD3; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 15px">
    </div>
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 8px">سنة امتحاني (الثانوية العامة)</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 48px; border-radius: 10px; border: 2px solid {{accent}}; background: #EEF2FD; font: inherit; font-size: 16px; font-weight: 700; color: #1F2328">2027</button>
        <button type="button" style="height: 48px; border-radius: 10px; border: 1.5px solid #C9CDD3; background: #FFFFFF; font: inherit; font-size: 16px; color: #5B616B">2028</button>
      </div>
      <p style="margin: 0; font-size: 12px; color: #5B616B">ده بيحدد لحد إمتى باقتك هتفضل سارية.</p>
    </fieldset>
  </form>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px; align-items: stretch">
    <a href="Home.dc.html" style="height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">ابدأ الدرس المجاني</a>
    <p style="margin: 0; text-align: center; font-size: 13px; color: #5B616B">عندك حساب؟ <a href="Home.dc.html">سجّل دخول</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#0F7B6C","#B45309"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2F5BEA' };
  }
}
</script>
</body>
</html>
