    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>

  <div style="display: flex; flex-direction: column; gap: 6px">

    <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #5B616B">لو حابب، ولي أمرك يوصله تقرير أسبوعي بالدروس اللي خلصتها ومستواك.</p>
  </div>
  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 52px; border-radius: 12px; border: 2px solid {{accent}}; background: #EEF2FD; font: inherit; font-size: 15px; font-weight: 700; color: #1F2328">ولي أمري</button>
      <button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #C9CDD3; background: #FFFFFF; font: inherit; font-size: 15px; color: #1F2328">أنا</button>
    </div>
  </fieldset>
  <form style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">

      <input id="pname" type="text" placeholder="أ. خالد" style="height: 48px; border: 1.5px solid #C9CDD3; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 15px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pphone" style="font-size: 13px; font-weight: 600">رقم الموبايل (للتقرير الأسبوعي)</label>
      <input id="pphone" type="tel" placeholder="01X XXXX XXXX" style="height: 48px; border: 1.5px solid #C9CDD3; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 15px; direction: ltr; text-align: right">
    </div>
  </form>
  <p style="margin: 0; font-size: 12px; line-height: 1.7; color: #5B616B">مش هنبعت أي حاجة غير التقرير ولينك الدفع لو طلبته. تقدر تلغي ده من الإعدادات.</p>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="Main.dc.html" style="height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">التالي</a>
