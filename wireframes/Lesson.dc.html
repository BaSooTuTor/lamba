<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مهمة في المحاكاة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1D3FB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 32px; display: flex; flex-direction: column; gap: 20px; background: #FFFFFF; color: #1F2328; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; direction: rtl">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Home.dc.html" aria-label="إغلاق الدرس" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F2328">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: {{accent}}"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
      <div style="height: 6px; border-radius: 999px; background: #E3E5E9"></div>
    </div>
    <div style="font-size: 12px; color: #5B616B">2 / 6</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; font-weight: 600; color: #5B616B">مهمتك</div>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">خلّي التيار 2 أمبير بالظبط</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #5B616B">حرّك الجهد والمقاومة لحد ما الأميتر يقرا 2.0 A.</p>
  </div>
  <div style="border: 1.5px solid #D8DBE0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: #FAFAFB">
    <svg width="100%" height="200" viewBox="0 0 320 200" role="img" aria-label="دايرة كهربية فيها بطارية ومقاومة ولمبة">
      <rect x="40" y="40" width="240" height="120" rx="6" fill="none" stroke="#1F2328" stroke-width="2"/>
      <rect x="22" y="80" width="36" height="40" fill="#FAFAFB" stroke="#1F2328" stroke-width="2"/>
      <text x="40" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2328">V</text>
      <rect x="130" y="150" width="60" height="20" fill="#FAFAFB" stroke="#1F2328" stroke-width="2"/>
      <text x="160" y="190" text-anchor="middle" font-size="12" fill="#5B616B">R</text>
      <circle cx="160" cy="40" r="34" fill="#F5B400" fill-opacity="{{ glow }}"/>
      <circle cx="160" cy="40" r="18" fill="#FAFAFB" stroke="#1F2328" stroke-width="2"/>
      <path d="M152 40l16 0M160 32l0 16" stroke="#1F2328" stroke-width="2"/>
      <circle cx="280" cy="100" r="20" fill="#FAFAFB" stroke="#1F2328" stroke-width="2"/>
      <text x="280" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2328">A</text>
    </svg>
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-top: 1.5px dashed #D8DBE0; padding-top: 12px">
      <div style="font-size: 13px; color: #5B616B">التيار في الأميتر</div>
      <div style="font-size: 26px; font-weight: 700; direction: ltr">I = {{ iText }} A</div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; font-size: 14px">
        <label for="volt" style="font-weight: 600">الجهد (V)</label>
        <span style="direction: ltr">{{ v }} V</span>
      </div>
      <input id="volt" type="range" min="0" max="24" step="1" value="{{ v }}" onChange="{{ onV }}" style="width: 100%; accent-color: {{accent}}; height: 32px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; font-size: 14px">
        <label for="res" style="font-weight: 600">المقاومة (R)</label>
        <span style="direction: ltr">{{ r }} Ω</span>
      </div>
      <input id="res" type="range" min="1" max="12" step="1" value="{{ r }}" onChange="{{ onR }}" style="width: 100%; accent-color: {{accent}}; height: 32px">
    </div>
  </div>
  <div style="{{ statusStyle }}">{{ statusText }}</div>
  <div style="font-size: 13px; line-height: 1.7; color: #5B616B">توقّعك كان: «هتنوّر أكتر». زوّد الجهد وشوف بنفسك.</div>
  <a href="Explain.dc.html" style="margin-top: auto; height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">كمّل للشرح</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#0F7B6C","#B45309"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: 6, r: 6 };
  }
  renderVals() {
    const v = this.state.v;
    const r = this.state.r;
    const i = v / r;
    return {
      accent: this.props.accent ?? '#2F5BEA',
      v: v,
      r: r,
      iText: i.toFixed(1),
      glow: Math.min(0.9, i / 4),
      statusText: Math.abs(i - 2) < 0.05 ? 'المهمة تمّت: التيار 2.0 أمبير' : 'لسه، التيار دلوقتي ' + i.toFixed(1) + ' أمبير',
      statusStyle: Math.abs(i - 2) < 0.05 ? 'border-radius: 12px; background: #E6F4F1; color: #0F7B6C; padding: 12px 14px; font-size: 15px; font-weight: 700' : 'border-radius: 12px; background: #F2F3F5; color: #1F2328; padding: 12px 14px; font-size: 15px; font-weight: 600',
      onV: (e) => this.setState({ v: Number(e.target.value) }),
      onR: (e) => this.setState({ r: Number(e.target.value) })
    };
  }
}
</script>
</body>
</html>
